[project]
name = "mcp-gryster"
version = "0.1.0"
description = "FastMCP server for Pygrister with custom-widget authoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.4,<4",
  "Pygrister==0.10.0",
  "pydantic>=2.11,<3",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
]

[project.scripts]
mcp-gryster = "mcp_gryster.__main__:main"

[dependency-groups]
dev = [
  "build",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-playwright",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gryster"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_gryster/widget/static/harness.html" = "mcp_gryster/widget/static/harness.html"
"src/mcp_gryster/widget/static/grist-bridge.js" = "mcp_gryster/widget/static/grist-bridge.js"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a local Docker daemon"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
